name = "seatback"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "seatback.len5ky.com", custom_domain = true }]

# public/ is the same dataset folder GitHub serves; / falls through to public/index.html.
[assets]
directory = "../public"
binding = "ASSETS"

# Saved taste profiles. scripts/deploy-worker.sh creates the namespace and fills in the id.
[[kv_namespaces]]
binding = "PROFILES"
id = "REPLACE_WITH_KV_ID"
