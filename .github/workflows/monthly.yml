# Monthly dataset refresh: fetch every airline, match against IMDb, export public/data, commit it back to main.
# Runs on the 1st and the 15th (some airlines publish the new cycle mid-month) and on demand.
#
# Cost: the IMDb bulk datasets are ~1.2 GB of .gz per download (inbound traffic, free and unmetered on
# GitHub-hosted runners); loading them into SQLite takes ~3 min. A full run is roughly 10-20 min, most of it the
# ~1,000 detail calls made by Lufthansa, JAL and ANA.
name: monthly

on:
  schedule:
    - cron: "17 5 1 * *"
    - cron: "17 5 15 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to fetch (YYYY-MM). Empty = current UTC month. BA, Singapore and Qantas only serve the current month."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-dataset
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MONTH: ${{ inputs.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Resolve month
        id: month
        run: echo "month=${MONTH:-$(date -u +%Y-%m)}" >> "$GITHUB_OUTPUT"

      # The IMDb files count as fresh for 7 days (by mtime), so the cache mainly saves re-runs and manual
      # dispatches in the same week; the 1st/15th runs usually download again.
      - name: Cache IMDb datasets
        uses: actions/cache@v4
        with:
          path: data/imdb/*.gz
          key: imdb-${{ steps.month.outputs.month }}

      - name: IMDb sync
        run: bun run cli imdb sync

      # One airline at a time; a failure is recorded in public/data/health.json and the rest continue.
      # The step fails only if every airline failed.
      # American answers 429 to GitHub runner IPs, so it is fetched and published from a local cron
      # (scripts/american-local.sh) and recorded here as "skipped".
      - name: Fetch all airlines
        id: fetch
        env:
          SKIP_AIRLINES: american
        run: scripts/fetch-all.sh "${{ steps.month.outputs.month }}"

      - name: Match
        run: bun run cli match

      # Seeds external_ids from public/data/ids.json, then asks Wikidata only for tconsts still missing (200 per POST, 1 req/s).
      # Not fatal: a failed batch only leaves tmdbId null until the next run.
      - name: IDs sync
        continue-on-error: true
        run: bun run cli ids sync

      - name: Export
        id: export
        run: |
          bun run cli export --month "${{ steps.month.outputs.month }}"
          bun scripts/build-index.ts public/data

      - name: Stats
        continue-on-error: true
        run: bun run cli stats --month "${{ steps.month.outputs.month }}"

      # Runs even when the fetch failed for every airline, so health.json still records this run; the job stays
      # failed. Only a fully successful export publishes catalogue files; otherwise just health.json goes out.
      - name: Commit dataset
        if: always() && steps.month.outcome == 'success'
        run: |
          msg="Publish ${{ steps.month.outputs.month }} catalogue data [skip ci]"
          if [[ "${{ steps.export.outcome }}" == success ]]; then
            git add public/data
          elif jq -e .airlines public/data/health.json >/dev/null 2>&1; then
            # keep this run's health.json, drop any half-written catalogue files
            cp public/data/health.json "$RUNNER_TEMP/health.json"
            git checkout -- public/data && git clean -fdq public/data
            cp "$RUNNER_TEMP/health.json" public/data/health.json
            git add public/data/health.json
            msg="Record ${{ steps.month.outputs.month }} fetch health (export did not run) [skip ci]"
          else
            echo "export did not run and there is no health.json to publish"
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "no dataset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload fetch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logs-${{ steps.month.outputs.month }}
          path: data/logs/
          if-no-files-found: ignore
          retention-days: 30
